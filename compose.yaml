# Optional portable database for development. Start only after generating .local credentials.
# docker compose --env-file .local/database.env up -d db
name: wfm-analytics-dev
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: wfm_migrator
      POSTGRES_PASSWORD: ${WFM_MIGRATION_PASSWORD:?Run node tools/local-env.mjs first}
      POSTGRES_DB: wfm_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - wfm_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfm_migrator -d wfm_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  wfm_postgres:
